# Mini Stock Exchange Platform — full stack.
#
# Service discovery is Docker DNS on the `mse-net` bridge network: services
# address each other by container name (http://account-service:8002), never by IP.
#
# Every application service builds from the REPOSITORY ROOT so it can COPY
# libs/ into the image. Bring up infrastructure only with `make infra` while
# services are still being written.

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  LOG_LEVEL: ${LOG_LEVEL}
  USER_SERVICE_URL: http://user-service:8001
  ACCOUNT_SERVICE_URL: http://account-service:8002
  ORDER_SERVICE_URL: http://order-service:8003
  MATCHING_ENGINE_URL: http://matching-engine:8004
  MARKET_DATA_SERVICE_URL: http://market-data-service:8005
  PORTFOLIO_SERVICE_URL: http://portfolio-service:8006
  NOTIFICATION_SERVICE_URL: http://notification-service:8007

x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-pg-common: &pg-common
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [mse-net]

services:
  # ==========================================================================
  # DATA STORES — one database per service (Database-per-Service pattern)
  # ==========================================================================
  postgres-user:
    <<: *pg-common
    container_name: mse-postgres-user
    environment:
      <<: *pg-env
      POSTGRES_DB: user_db
    ports: ["5433:5432"]
    volumes: [pg-user:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-account:
    <<: *pg-common
    container_name: mse-postgres-account
    environment:
      <<: *pg-env
      POSTGRES_DB: account_db
    ports: ["5434:5432"]
    volumes: [pg-account:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-order:
    <<: *pg-common
    container_name: mse-postgres-order
    environment:
      <<: *pg-env
      POSTGRES_DB: order_db
    ports: ["5435:5432"]
    volumes: [pg-order:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- Market Data: PRIMARY (writes) + REPLICA (chart/history reads) -------
  postgres-market-primary:
    <<: *pg-common
    container_name: mse-postgres-market-primary
    environment:
      <<: *pg-env
      POSTGRES_DB: market_db
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports: ["5436:5432"]
    volumes:
      - pg-market-primary:/var/lib/postgresql/data
      - ./infra/postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d market_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-market-replica:
    <<: *pg-common
    container_name: mse-postgres-market-replica
    # NOTE: deliberately NO POSTGRES_DB — the replica must never initdb, it is
    # a base backup of the primary.
    environment:
      <<: *pg-env
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    user: postgres
    entrypoint: ["/bin/bash", "/setup-replica.sh"]
    ports: ["5437:5432"]
    volumes:
      - pg-market-replica:/var/lib/postgresql/data
      - ./infra/postgres/replica/setup-replica.sh:/setup-replica.sh:ro
    depends_on:
      postgres-market-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d market_db"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres-portfolio:
    <<: *pg-common
    container_name: mse-postgres-portfolio
    environment:
      <<: *pg-env
      POSTGRES_DB: portfolio_db
    ports: ["5438:5432"]
    volumes: [pg-portfolio:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-notification:
    <<: *pg-common
    container_name: mse-postgres-notification
    environment:
      <<: *pg-env
      POSTGRES_DB: notification_db
    ports: ["5439:5432"]
    volumes: [pg-notification:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ==========================================================================
  # INFRASTRUCTURE — cache/locks/pub-sub and the event backbone
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: mse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    networks: [mse-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [mse-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ==========================================================================
  # APPLICATION SERVICES
  # ==========================================================================
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    container_name: mse-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      SERVICE_PORT: 8000
    ports: ["8000:8000"]
    networks: [mse-net]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  user-service:
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    container_name: mse-user-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: user-service
      SERVICE_PORT: 8001
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-user:5432/user_db
    ports: ["8001:8001"]
    networks: [mse-net]
    depends_on:
      postgres-user: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  account-service:
    build: { context: ., dockerfile: services/account-service/Dockerfile }
    container_name: mse-account-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: account-service
      SERVICE_PORT: 8002
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-account:5432/account_db
    ports: ["8002:8002"]
    networks: [mse-net]
    depends_on:
      postgres-account: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    container_name: mse-order-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: order-service
      SERVICE_PORT: 8003
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-order:5432/order_db
    ports: ["8003:8003"]
    networks: [mse-net]
    depends_on:
      postgres-order: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  matching-engine:
    build: { context: ., dockerfile: services/matching-engine/Dockerfile }
    container_name: mse-matching-engine
    restart: unless-stopped
    # No database: the order book is in memory by design.
    environment:
      <<: *common-env
      SERVICE_NAME: matching-engine
      SERVICE_PORT: 8004
    ports: ["8004:8004"]
    networks: [mse-net]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  market-data-service:
    build: { context: ., dockerfile: services/market-data-service/Dockerfile }
    container_name: mse-market-data-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: market-data-service
      SERVICE_PORT: 8005
      # writes -> primary, chart/history reads -> replica
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-market-primary:5432/market_db
      DATABASE_REPLICA_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-market-replica:5432/market_db
    ports: ["8005:8005"]
    networks: [mse-net]
    depends_on:
      postgres-market-primary: { condition: service_healthy }
      postgres-market-replica: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  portfolio-service:
    build: { context: ., dockerfile: services/portfolio-service/Dockerfile }
    container_name: mse-portfolio-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: portfolio-service
      SERVICE_PORT: 8006
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-portfolio:5432/portfolio_db
    ports: ["8006:8006"]
    networks: [mse-net]
    depends_on:
      postgres-portfolio: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    container_name: mse-notification-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      SERVICE_PORT: 8007
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-notification:5432/notification_db
    ports: ["8007:8007"]
    networks: [mse-net]
    depends_on:
      postgres-notification: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8007/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is inlined at BUILD time — passing it only as `environment`
      # would leave the app calling `undefined/api/...`.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: mse-frontend
    restart: unless-stopped
    ports: ["3000:3000"]
    networks: [mse-net]
    depends_on:
      gateway: { condition: service_healthy }

networks:
  mse-net:
    driver: bridge

volumes:
  pg-user:
  pg-account:
  pg-order:
  pg-market-primary:
  pg-market-replica:
  pg-portfolio:
  pg-notification:
  redis-data:
  rabbitmq-data:
