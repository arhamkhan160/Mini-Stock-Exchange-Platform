# Solo development for the Matching Engine.
# It has no database, so this is just the broker (and Redis, which the rest of
# the stack expects to exist even though the engine never touches it).
#
#   docker compose -f docker-compose.dev.yml up -d
#   PYTHONPATH=.:../../libs SERVICE_NAME=matching-engine SERVICE_PORT=8004 \
#     RABBITMQ_URL=amqp://guest:guest@localhost:5672/ \
#     uvicorn app.main:app --reload --port 8004
#
# The matching algorithm itself needs none of this — run `python selfcheck.py`.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
