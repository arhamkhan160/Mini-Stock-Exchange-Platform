# Solo development for the Order Service.
#
#   docker compose -f docker-compose.dev.yml up -d
#   python scripts/fake_reservations.py          # stands in for Team B and Team D
#   PYTHONPATH=.:../../libs SERVICE_NAME=order-service SERVICE_PORT=8003 \
#     DATABASE_URL=postgresql+asyncpg://mse:mse_pw@localhost:5435/order_db \
#     REDIS_URL=redis://localhost:6379/0 \
#     RABBITMQ_URL=amqp://guest:guest@localhost:5672/ \
#     ACCOUNT_SERVICE_URL=http://localhost:8002 \
#     PORTFOLIO_SERVICE_URL=http://localhost:8006 \
#     uvicorn app.main:app --reload --port 8003
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mse
      POSTGRES_PASSWORD: mse_pw
      POSTGRES_DB: order_db
    ports: ["5435:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
